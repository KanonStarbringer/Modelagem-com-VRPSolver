# Igual a PRUO.cfg, com limites de enumeração 10x menores (n100, a partir da CL c1 s1).
# Parâmetros do VRPSolver para o PRUO. Base: config/VRPTW_set_1.cfg (demo VRPTW)
# e a heurística de mergulho do demo PDPTW, porque aqui não há limitante superior inicial.
GlobalTimeLimit = 3600
RCSPstopCutGenTimeThresholdInPricing = 5
RCSPhardTimeThresholdInPricing = 10
RCSPuseBidirectionalSearch = 1
RCSPmaxNGneighbourhoodSize = 32 # a vizinhança ng é contada em cópias (até ~4 por tarefa)
RCSPrankOneCutsMaxNumRows = 5
RCSPrankOneCutsMemoryType = 1
RCSPmaxNumOfEnumeratedSolutions = 100000
RCSPmaxNumOfLabelsInEnumeration = 100000 # padrão 1000000; com 1e6 a CL n100 c1 s1 passou de 22 GB
StrongBranchingPhaseOneCandidatesNumber = 50
StrongBranchingPhaseOneTreeSizeEstimRatio = 0.1
StrongBranchingPhaseTwoTreeSizeEstimRatio = 0.1
CutTailingOffThreshold = 0.015
DivingHeurUseDepthLimit = 10
MaxLDSbreadth = 1
MaxLDSdepth = 1000
